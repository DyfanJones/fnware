url: https://dyfanjones.github.io/fnware/

template:
  bootstrap: 5
  light-switch: true

articles:
  - title: Guides
    navbar: ~
    contents:
      - retry
      - circuitbreaker
      - fallback
      - logging
      - caching
      - contextmanager
      - validation

reference:
  - title: Retrying
    desc: Call a function again when it fails.
    contents:
      - retry
      - stop_never
      - wait_fixed
      - retry_all
      - before_sleep_none
      - after_sleep_none
      - extending_retry
      - async_retry

  - title: Caching
    desc: Remember a function's results.
    contents:
      - lru_cache
      - async_lru_cache

  - title: Circuit breaking
    desc: Stop calling a function that keeps failing.
    contents:
      - circuit_breaker
      - async_circuit_breaker

  - title: Timeouts
    desc: Bound how long a single call can run.
    contents:
      - timeout
      - extending_timeout
      - async_timeout

  - title: Rate limiting
    desc: Limit how often a function can be called.
    contents:
      - rate_limit
      - async_rate_limit

  - title: Fallbacks
    desc: Return a default instead of failing.
    contents:
      - fallback
      - async_fallback

  - title: Observability
    desc: Log calls and run a function once.
    contents:
      - log_call
      - log_levels
      - logger_base
      - extending_log
      - once

  - title: Validation
    desc: Check arguments and return values.
    contents:
      - validate_args

  - title: Context managers
    desc: Write setup and teardown once.
    contents:
      - contextmanager
      - with_context
      - as_decorator

  - title: Re-exports
    contents:
      - reexports
